# Services internos de las cinco APIs - El Quetzal - Equipo virtual4insanity (Rol 4)
# ClusterIP con los mismos nombres que usa el gateway (api-<servicio>:5000).
# Los selectores coinciden con las etiquetas de los Pods de backend-deployment.yaml.
apiVersion: v1
kind: Service
metadata:
  name: api-catalogo
  namespace: proyecto-2-virtual4insanity
  labels:
    app: elquetzal
    componente: api-catalogo
    equipo: virtual4insanity
spec:
  type: ClusterIP
  selector:
    app: elquetzal
    componente: api-catalogo
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
