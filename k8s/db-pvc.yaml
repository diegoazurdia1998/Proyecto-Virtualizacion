# Disco persistente de PostgreSQL - El Quetzal - Equipo virtual4insanity
# Equivale al volumen nombrado elquetzal-pgdata del Proyecto 1 (Docker Compose).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elquetzal-pgdata
  namespace: proyecto-2-virtual4insanity
  labels:
    app: elquetzal
    componente: db
    equipo: virtual4insanity
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi