# ==============================================================================
# DEPLOYMENT: API CATÁLOGO
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-catalogo
  namespace: proyecto-2-virtual4insanity
  labels:
    app: elquetzal
    componente: api-catalogo
    equipo: virtualinsanity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elquetzal
      componente: api-catalogo
  template:
    metadata:
      labels:
        app: elquetzal
        componente: api-catalogo
    spec:
      containers:
      - name: api-catalogo
        image: virtual4insanity/elquetzal-catalogo:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: elquetzal-backend-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: elquetzal-backend-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: elquetzal-backend-config
              key: CATALOGO_DB
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: elquetzal-backend-config
              key: CATALOGO_DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: elquetzal-db-secret
              key: CATALOGO_DB_PASSWORD

---
