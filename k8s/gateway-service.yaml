# Service del gateway - punto de entrada único desde fuera del clúster (Rol 1)
# NodePort: se accede por http://<IP-de-la-VM>:30080
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: proyecto-2-virtual4insanity
  labels:
    app: elquetzal
    componente: gateway
    equipo: virtual4insanity
spec:
  type: NodePort
  selector:
    app: elquetzal
    componente: gateway
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
