# Plantilla del Secret de la base de datos - El Quetzal - Equipo virtual4insanity
# Este archivo solo documenta la estructura; los valores son de ejemplo.
# El Secret real se crea en la VM a partir del .env (que no se sube a Git):
#
#   kubectl create secret generic elquetzal-db-secret \
#     -n proyecto-2-virtual4insanity \
#     --from-env-file=<(grep '_PASSWORD=' .env)
#   kubectl label secret elquetzal-db-secret -n proyecto-2-virtual4insanity \
#     app=elquetzal equipo=virtual4insanity
apiVersion: v1
kind: Secret
metadata:
  name: elquetzal-db-secret
  namespace: proyecto-2-virtual4insanity
  labels:
    app: elquetzal
    equipo: virtual4insanity
type: Opaque
stringData:
  POSTGRES_PASSWORD: cambiar_esta_clave
  CATALOGO_DB_PASSWORD: cambiar_esta_clave
  INVENTARIO_DB_PASSWORD: cambiar_esta_clave
  CLIENTES_DB_PASSWORD: cambiar_esta_clave
  PEDIDOS_DB_PASSWORD: cambiar_esta_clave
  REPORTES_DB_PASSWORD: cambiar_esta_clave