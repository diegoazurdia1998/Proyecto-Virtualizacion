# nginx interno del frontend: solo sirve el build de Vue.
# Las rutas /api/ las resuelve el gateway, no este contenedor.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vue usa rutas propias (/inventario, /pedidos); si el archivo no existe, devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}